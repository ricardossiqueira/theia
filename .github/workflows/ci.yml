name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build Linux ARM64 release artifact
        run: |
          mkdir -p release
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-X main.version=${GITHUB_SHA}" -o release/orangepi-monitor ./cmd/orangepi-monitor
          tar -C release -czf release/orangepi-monitor-linux-arm64.tar.gz orangepi-monitor
          sha256="$(sha256sum release/orangepi-monitor-linux-arm64.tar.gz | awk '{print $1}')"
          printf '{\n  "schema_version": 1,\n  "revision": "%s",\n  "artifacts": [\n    {\n      "name": "orangepi-monitor",\n      "architecture": "linux-arm64",\n      "file": "orangepi-monitor-linux-arm64.tar.gz",\n      "sha256": "%s"\n    }\n  ]\n}\n' "$GITHUB_SHA" "$sha256" > release/release-manifest.json

      - uses: actions/upload-artifact@v4
        with:
          name: orangepi-monitor-linux-arm64
          path: release/
          if-no-files-found: error

  publish:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: orangepi-monitor-linux-arm64
          path: release

      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="deploy-${GITHUB_SHA}"
          if gh release view "$tag" >/dev/null 2>&1; then
            mkdir existing-release
            gh release download "$tag" --pattern release-manifest.json --dir existing-release
            diff --unified existing-release/release-manifest.json release/release-manifest.json
            gh release view "$tag" --json assets --jq '.assets[].name' | grep --fixed-strings --line-regexp orangepi-monitor-linux-arm64.tar.gz
            exit 0
          fi

          gh release create "deploy-${GITHUB_SHA}" \
            --target "$GITHUB_SHA" \
            --title "Deploy ${GITHUB_SHA}" \
            --notes "Linux ARM64 artifact built by CI for ${GITHUB_SHA}." \
            release/orangepi-monitor-linux-arm64.tar.gz \
            release/release-manifest.json
